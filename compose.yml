services:
  api:
    build: .
    environment:
      APP_NAME: platform-api-compose
      APP_VERSION: "0.2"
    expose:
      - "8080"
    networks:
      - backend
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - backend
networks:
  backend:
